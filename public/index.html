<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train Refund</title>
<style>
  :root { --ink:#1b1f24; --muted:#5f6b77; --line:#e3e7eb; --bg:#f6f7f9; --accent:#0b6b4f; --warn:#a15c00; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 2px; } h2 { font-size:16px; margin:28px 0 10px; }
  .sub { color:var(--muted); margin:0 0 8px; font-size:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .amount { font-size:26px; font-weight:700; color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  input, select, textarea { font:inherit; width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; margin-top:4px; }
  textarea { min-height:110px; }
  label { display:block; font-size:14px; color:var(--muted); margin-top:8px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--bg); color:var(--muted); }
  .pill.owed, .pill.ready { background:#e2f3ec; color:var(--accent); }
  .pill.needs_arrival_time { background:#fff1dc; color:var(--warn); }
  details summary { cursor:pointer; color:var(--muted); font-size:14px; margin-top:8px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:14px; margin:8px 0 0; }
  dt { color:var(--muted); }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 14px; border-radius:8px; display:none; }
  .empty { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Train Refund</h1>
  <p class="sub">We watch your trains and get your Delay Repay claim ready.</p>

  <h2>Money you're owed</h2>
  <div id="claims"></div>

  <h2>Needs your arrival time</h2>
  <div id="arrivals"></div>

  <h2>Your journeys</h2>
  <div class="row" style="margin:0 0 10px"><button id="check">Check delays now</button><span id="gmail"></span></div>
  <div id="journeys"></div>

  <h2>Add a booking</h2>
  <div class="card">
    <label for="email">Paste your Trainline confirmation email</label>
    <textarea id="email" placeholder="Booking reference: …"></textarea>
    <div class="row"><button class="primary" id="add">Add booking</button></div>
  </div>

  <h2>Your details</h2>
  <form class="card" id="profile">
    <p class="sub">Used to fill in claim forms. We never ask for bank or card details.</p>
    <label>Full name<input name="fullName" required></label>
    <label>Email<input name="email" type="email" required></label>
    <label>Address<input name="addressLine1" required></label>
    <label>Town<input name="town" required></label>
    <label>Postcode<input name="postcode" required></label>
    <label>Refund method<select name="payout">
      <option value="original_payment">Original payment method</option>
      <option value="bank_transfer">Bank transfer</option>
      <option value="voucher">Rail voucher</option>
      <option value="charity">Donate to charity</option>
    </select></label>
    <div class="row"><button class="primary">Save details</button></div>
  </form>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (p) => "£" + (p / 100).toFixed(2);
const when = (dt) => new Date(dt + ":00").toLocaleString("en-GB", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });

function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2600); }

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

let state;
async function load() {
  state = await api("GET", "/api/state");
  const active = state.claims.filter((c) => c.status === "ready" || c.status === "submitted");
  $("claims").innerHTML = active.length ? active.map(claimCard).join("") : `<p class="empty">Nothing owed right now.</p>`;

  const waiting = state.journeys.filter((j) => j.status === "needs_arrival_time");
  $("arrivals").innerHTML = waiting.length ? waiting.map((j) => `
    <div class="card"><strong>${esc(j.from)} → ${esc(j.to)}</strong><div class="sub">${esc(j.reason)}</div>
      <label>What time did you reach ${esc(j.to)}?<input type="time" id="t-${esc(j.reference)}"></label>
      <div class="row"><button class="primary" data-arrival="${esc(j.reference)}">Work out my refund</button></div></div>`).join("")
    : `<p class="empty">Nothing to fill in.</p>`;

  $("journeys").innerHTML = state.journeys.length ? state.journeys.slice().reverse().map((j) => `
    <div class="card"><strong>${esc(j.from)} → ${esc(j.to)}</strong> <span class="pill ${esc(j.status)}">${esc(j.status.replace(/_/g, " "))}</span>
      <div class="sub">${when(j.departure)} · ${esc(j.reference)}${j.reason ? " · " + esc(j.reason) : ""}</div></div>`).join("")
    : `<p class="empty">No journeys yet. Add a booking below.</p>`;

  $("gmail").innerHTML = !state.gmailAvailable ? ""
    : state.gmailConnected ? `<button id="sync">Sync Gmail</button>`
    : `<a href="/auth/google"><button type="button">Connect Gmail</button></a>`;

  if (state.profile) for (const [k, v] of Object.entries(state.profile)) { const el = $("profile").elements[k]; if (el) el.value = v; }
}

function claimCard(c) {
  const submitted = c.status === "submitted";
  return `<div class="card">
    <div class="amount">${money(c.expectedRefundPence)}</div>
    <div class="sub">${esc(c.operator)} · claim by ${esc(c.deadline)} <span class="pill ${esc(c.status)}">${submitted ? "submitted" : "ready to claim"}</span></div>
    ${c.fields ? `<details><summary>What we'll fill in</summary><dl>${c.fields.map((f) => `<dt>${esc(f.label)}</dt><dd style="margin:0">${esc(f.value)}</dd>`).join("")}</dl></details>`
               : `<p class="sub">Add your details below to prepare this claim.</p>`}
    <div class="row">${submitted
      ? `<button data-status="paid" data-id="${esc(c.id)}">I've been paid</button><button data-status="rejected" data-id="${esc(c.id)}">Rejected</button>`
      : c.packText ? `<button class="primary" data-claim="${esc(c.id)}">Copy details &amp; open claim form</button>
                      <button data-status="submitted" data-id="${esc(c.id)}">I've submitted it</button>` : ""}</div>
  </div>`;
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.claim) {
      const c = state.claims.find((x) => x.id === b.dataset.claim);
      await navigator.clipboard.writeText(c.packText).catch(() => {});
      if (c.claimUrl) window.open(c.claimUrl, "_blank", "noopener");
      toast("Details copied — paste them into the form");
    } else if (b.dataset.status) {
      await api("POST", `/api/claims/${b.dataset.id}/status`, { status: b.dataset.status }); await load();
    } else if (b.dataset.arrival) {
      const time = $("t-" + b.dataset.arrival).value;
      const r = await api("POST", `/api/journeys/${encodeURIComponent(b.dataset.arrival)}/arrival`, { time });
      toast(r.status === "owed" ? "You're owed money — claim is ready" : "Not enough delay to claim"); await load();
    } else if (b.id === "add") {
      const r = await api("POST", "/api/bookings", { email: $("email").value });
      toast(r.added ? `Added ${r.reference}` : `${r.reference} is already tracked`); $("email").value = ""; await load();
    } else if (b.id === "check") {
      const r = await api("POST", "/api/check"); toast(`Checked ${r.checked} journey(s), ${r.newClaims} new claim(s)`); await load();
    } else if (b.id === "sync") {
      const r = await api("POST", "/api/gmail/sync"); toast(`Found ${r.added} new booking(s)`); await load();
    }
  } catch (err) { toast(err.message); }
});

$("profile").addEventListener("submit", async (e) => {
  e.preventDefault();
  try { await api("PUT", "/api/profile", Object.fromEntries(new FormData(e.target))); toast("Details saved"); await load(); }
  catch (err) { toast(err.message); }
});

load().catch((err) => toast(err.message));
</script>
</body>
</html>
